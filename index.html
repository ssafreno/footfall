<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>footfall</title>
  <style>
    :root {
      --ink: #f2f3f5;
      --ink-dim: rgba(242, 243, 245, 0.62);
      --panel: rgba(16, 18, 22, 0.62);
      --edge: rgba(255, 255, 255, 0.09);
      --key: rgba(255, 255, 255, 0.08);
      --accent: #ffd36b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #0d0f13;
      color: var(--ink);
      font: 14px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    #app, #app canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

    /* ---- start overlay ---- */
    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at center, rgba(8, 10, 14, 0.25) 0%, rgba(8, 10, 14, 0.7) 100%);
      cursor: pointer;
      transition: opacity 180ms ease;
    }
    body.locked #overlay { opacity: 0; pointer-events: none; }
    .panel {
      width: min(360px, 100%);
      padding: 28px 28px 22px;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      text-align: center;
    }
    .brand {
      margin: 0 0 4px;
      font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-dim);
    }
    .cta {
      margin: 0 0 22px;
      font-size: 26px; font-weight: 650; letter-spacing: -0.01em;
    }
    body:not(.ready) .cta { color: var(--ink-dim); }
    body:not(.ready) .cta::after { content: "…"; }
    .controls {
      display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items: center;
      margin: 0 auto; padding: 18px 0 0; border-top: 1px solid var(--edge);
      text-align: left; width: fit-content;
    }
    .keys { display: flex; gap: 4px; justify-content: flex-end; }
    kbd {
      display: inline-grid; place-items: center;
      min-width: 26px; height: 26px; padding: 0 7px;
      font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--ink);
      background: var(--key);
      border: 1px solid var(--edge);
      border-bottom-width: 2px;
      border-radius: 6px;
    }
    .controls span { color: var(--ink-dim); }
    .foot { margin: 18px 0 0; font-size: 12px; color: var(--ink-dim); }
    .error { margin: 16px 0 0; font-size: 12.5px; color: var(--accent); }

    /* ---- in-game HUD ---- */
    #crosshair {
      position: fixed; left: 50%; top: 50%; z-index: 5;
      width: 4px; height: 4px; margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
      opacity: 0; transition: opacity 150ms ease;
      pointer-events: none;
    }
    #hint {
      position: fixed; left: 16px; bottom: 16px; z-index: 5;
      padding: 7px 11px;
      font-size: 12px; color: var(--ink-dim);
      background: rgba(16, 18, 22, 0.45);
      border: 1px solid var(--edge);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0; transition: opacity 150ms ease;
      pointer-events: none;
    }
    #hint b { color: var(--ink); font-weight: 600; }
    body.locked #crosshair, body.locked #hint { opacity: 1; }
  </style>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="overlay">
    <div class="panel">
      <p class="brand">footfall</p>
      <h1 class="cta">Click to play</h1>
      <div class="controls">
        <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div><span>Move</span>
        <div class="keys"><kbd>Mouse</kbd></div><span>Look</span>
        <div class="keys"><kbd>Space</kbd></div><span>Jump</span>
        <div class="keys"><kbd>Shift</kbd></div><span>Crouch (hold)</span>
        <div class="keys"><kbd>Esc</kbd></div><span>Release mouse</span>
      </div>
      <p class="foot">Jump onto things. Duck under the low ones.</p>
      <p class="error" id="error" hidden></p>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="hint"><b>WASD</b> move · <b>Space</b> jump · <b>Shift</b> crouch · <b>Esc</b> release</div>

  <script>
    // ES modules don't load from file:// — say so instead of sitting on a dead overlay.
    if (location.protocol === 'file:') {
      const el = document.getElementById('error');
      el.textContent = 'Serve this folder over HTTP: python3 -m http.server 5173';
      el.hidden = false;
    }
    window.addEventListener('error', (e) => {
      const el = document.getElementById('error');
      el.textContent = 'Failed to start: ' + (e.message || 'see console');
      el.hidden = false;
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
